app = "vn-app"
primary_region = "iad"

[build]

[http_service]
  internal_port = 6101
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/v0/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
